name: Real local zkVM execution proofs
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  cpu-stark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Host build and isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgmp-dev libssl-dev bubblewrap meson ninja-build pkg-config libcap-dev
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          bash scripts/setup-sandbox.sh
      - name: Build pinned local prover and static verifier
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          mkdir -p artifacts
          set +e
          bash scripts/setup-zkvm.sh 2>&1 | tee artifacts/zkvm-build.log
          OMEGA_ZK_BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if test "$OMEGA_ZK_BUILD_STATUS" -ne 0; then
            .venv/bin/python -c 'from pathlib import Path; text=Path("artifacts/zkvm-build.log").read_text(errors="replace")[-2500:]; print("::error title=zkVM prover build diagnostic::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            {
              printf '### Local prover build failure\n\n```text\n'
              tail -n 100 artifacts/zkvm-build.log
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$OMEGA_ZK_BUILD_STATUS"
      - name: Unit checks including forbidden fake receipts
        run: CARGO_TARGET_DIR="$GITHUB_WORKSPACE/build/risc0" cargo +1.90.0 test --release --locked --no-default-features --manifest-path omega_zk/risc0/Cargo.toml
      - name: Real succinct proof, independent verification and adversarial rejection
        env:
          OMEGA_RISC0_PROVER: ${{ github.workspace }}/build/risc0/release/omega-risc0
          OMEGA_RISC0_VERIFIER: ${{ github.workspace }}/build/risc0/x86_64-unknown-linux-musl/release/omega-risc0
        run: .venv/bin/python -m pytest testes/zkvm/test_execution.py -q --junitxml=artifacts/zkvm-real.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zkvm-cpu-evidence
          path: |
            artifacts/zkvm-real.xml
            artifacts/zkvm-build.log
            build/risc0/x86_64-unknown-linux-musl/release/omega-risc0
