name: Omega foundation and regression
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  clean-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install trusted system prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev zstd libegl1 libopengl0 bubblewrap meson ninja-build pkg-config libcap-dev ripgrep
      - name: Enable the namespace mechanism on the disposable runner
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /usr/bin/true
      # Compiled Mathlib/Lake outputs are deliberately not restored. Generated
      # proof imports must be build targets on a genuinely clean machine.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../.cache/pip
          key: ${{ runner.os }}-${{ matrix.os }}-py31214-${{ hashFiles('requirements/cpu-py312.lock') }}
      - run: bash scripts/setup.sh
      - name: Complete regression
        run: bash scripts/test.sh -q --junitxml=artifacts/test-results.xml
      - name: Manifest-based differential corpus
        run: .venv/bin/python scripts/regression.py --output artifacts/foundation/corpus.json
      - name: Native security, fuzzing and sanitizers
        run: .venv/bin/python scripts/security.py --output artifacts/foundation/security.json
      - name: Build packages and provenance
        run: |
          .venv/bin/python -m build --no-isolation
          .venv/bin/python scripts/build-manifest.py --output artifacts/build-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: omega-validation-${{ matrix.os }}
          path: |
            artifacts/test-results.xml
            artifacts/foundation
            artifacts/build-manifest.json
            build/selfhost/bootstrap.json
            dist/*.whl
            dist/*.tar.gz
