name: Six-component native induction and software WebGPU
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Install CPU and software Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libssl-dev bubblewrap libvulkan1 mesa-vulkan-drivers
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          .venv/bin/python -m pip install -e '.[dev,tools,webgpu]'
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import os,tempfile
          manifests=sorted(Path('/usr/share/vulkan/icd.d').glob('*lvp*.json'))
          assert manifests, 'Software Vulkan ICD required; no silent GPU skip'
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('VK_ICD_FILENAMES='+str(manifests[0])+'\n')
              stream.write('XDG_RUNTIME_DIR='+tempfile.mkdtemp(prefix='omega-xdg-')+'\n')
          PY
      - name: Require real shader execution on the software adapter
        run: .venv/bin/python -m omega_recursive sieve omega_singularity/examples/sieve.json --backend gpu
      - name: Source distribution, CPU checker, isolated ELF and peer protocol
        run: |
          .venv/bin/python -m omega_recursive.amalgamation --check
          .venv/bin/python -m pytest testes/recursive -q --junitxml=artifacts/recursive.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recursive-software-vulkan
          path: artifacts/recursive.xml
