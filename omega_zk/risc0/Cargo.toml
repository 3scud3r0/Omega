[package]
name = "omega-risc0"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
default = ["prover"]
prover = ["risc0-zkvm/prove", "dep:rayon"]

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
risc0-binfmt = { version = "=3.0.2" }
risc0-zkos-v1compat = { version = "=2.2.0" }
bincode = "=1.3.3"
sha2 = "=0.10.9"
hex = "=0.4.3"
serde_json = "=1.0.145"
rayon = { version = "=1.11.0", optional = true }

[profile.release]
opt-level = 2
debug = 0
strip = true
incremental = false
