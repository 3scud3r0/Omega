[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linguagem-omega"
version = "2.0.0"
description = "Linguagem Ômega: compilador auto-hospedado, tensores racionais nativos, Nextorch e núcleo verificado em Lean 4"
requires-python = ">=3.10"

[project.scripts]
omega = "omega.cli:principal"
omegac = "omega_selfhost.driver:compiler_main"

[project.optional-dependencies]
neural = ["torch>=2.5,<3", "numpy>=1.26,<3", "z3-solver>=4.13,<5"]
orange = ["Orange3>=3.38,<4", "PyQt6>=6.7,<7", "pyqtgraph>=0.13"]
dev = ["pytest>=8", "build>=1", "jsonschema>=4,<5"]
umap = ["umap-learn>=0.5,<1"]
tools = ["pypdf>=5,<7", "wasmtime>=31,<40", "cryptography>=44,<51"]
gpu = ["triton>=3; platform_system == 'Linux'"]

[project.entry-points."orange.widgets"]
"Nextorch Epistemic AI" = "nextorch.orange"
"Omega Certified Synthesis" = "omega_nextorch.orange"

[tool.setuptools.packages.find]
include = ["omega", "omega_open", "omega_nextorch*", "omega_selfhost*", "omega_platform*", "omega_agent*", "omega_bench*", "omega_coder*", "omega_evolution*", "omega_learning*", "omega_memory*", "omega_security*", "omega_tools*", "nextorch*"]

[tool.setuptools.package-data]
"nextorch.orange" = ["icons/*.svg"]
"omega_nextorch" = ["*.lean"]
"omega_nextorch.orange" = ["*.svg"]
"omega_selfhost" = ["*.omega", "*.h", "*.lean", "*.c"]

[tool.pytest.ini_options]
testpaths = ["testes"]
markers = ["orange: Orange/Qt integration", "lean: Lean executable integration", "gpu: CUDA/Triton integration"]
